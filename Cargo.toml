[package]
name = "python-gamedig"
version = "0.10.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gamedig"
crate-type = ["cdylib"]

[dependencies]
gamedig = { version = "0.9.0", features = ["serde", "tls"] }
pyo3 = "0.30.1"
serde-pyobject = "0.8.0"
